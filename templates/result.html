<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="/brand/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/site.css">
<meta name="robots" content="noindex">
<title>Honouring {{name}} · LoveWorld Expo Moment</title>
<meta property="og:title" content="Honouring {{name}}">
<meta property="og:description" content="A LoveWorld Expo Moment">
<meta property="og:image" content="{{base_url}}/poster/{{token}}.jpg">
<meta property="og:type" content="video.other">
</head>
<body data-scene="result">
<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<main class="wrap">
  <header class="bar fade-up" style="--d:.1s">
    <a href="/"><img src="/brand/logo.png" alt="LoveWorld Expo 2026"></a>
    <span class="tag">Expo Moment</span>
  </header>
  <section class="result">
    <div class="hello">
      <div class="eyebrow fade-up" style="--d:.3s">Certificate of Presence</div>
      <p class="honouring fade-up" style="--d:.35s">Honouring</p>
      <h1 class="display name reveal">{{name}}</h1>
    </div>
    <div class="frame fade-up" style="--d:.9s">
      <video src="/media/{{token}}.mp4" poster="/poster/{{token}}.jpg" playsinline preload="metadata"></video>
      <button class="play" type="button" aria-label="Play your video">
        <span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>
      </button>
    </div>
    <div class="cta fade-up" style="--d:1.1s">
      <div class="actions">
        <a class="btn btn-gold" id="download" href="/media/{{token}}.mp4?download=1" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>Download</a>
        <button class="btn btn-glass" id="share" type="button" data-url="{{url}}" data-title="My LoveWorld Expo Moment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 13v5.5h14V13"/></svg>Share</button>
      </div>
      <p class="note" id="note" role="status"></p>
      <p class="hint">Tap the gold medallion</p>
    </div>
  </section>
  <footer class="site"><span>A LoveWorld Expo Moment</span><span>LoveWorld Expo 2026</span></footer>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="/static/js/award-scene.js"></script>
<script src="/static/js/site.js" defer></script>
</body>
</html>
