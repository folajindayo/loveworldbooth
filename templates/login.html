<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="/brand/logo.png">
<title>Operator login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap">
  <h1>Operator login</h1>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{next}}">
    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus required>
    <div class="error">{{error}}</div>
    <button class="primary" type="submit">Log in</button>
  </form>
</main>
</body>
</html>
