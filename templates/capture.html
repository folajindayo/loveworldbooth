<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="/brand/logo.png">
<title>Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topbar">
  <strong><img src="/brand/logo.png" alt="">Expo Moment</strong>
  <a href="/capture" class="active">Capture</a>
  <a href="/qc">QC</a>
  <a href="/admin">Admin</a>
  <form method="post" action="/logout"><button class="linkbtn">Log out</button></form>
</nav>

<main class="wrap">
  <form id="form" novalidate>
    <h1>New visitor</h1>

    <label for="name">Name (as it should appear in the video)</label>
    <input id="name" name="name" type="text" maxlength="40" autocomplete="off" required>

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="off" required>

    <label>Template</label>
    <div class="segmented" id="templates"></div>

    <label>Photo</label>
    <div class="guide">
      <svg width="54" height="96" viewBox="0 0 54 96" aria-hidden="true">
        <rect x="1" y="1" width="52" height="94" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
        <circle cx="27" cy="17" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M15 30h24l3 30h-6l-1 28h-8V62h-4v26h-8l-1-28h-6z" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <ul>
        <li>Full body, head to feet, centred</li>
        <li>Visitor faces the camera, arms relaxed</li>
        <li>Good light on the face, plain background</li>
        <li>Phone upright, only the visitor in shot</li>
      </ul>
    </div>
    <label class="photo-pick" id="photo-pick">
      <span id="photo-label">Take photo</span>
      <input id="photo" name="photo" type="file" accept="image/*" capture="environment">
    </label>
    <img id="preview" class="preview" alt="Photo preview">

    <label class="consent">
      <input id="consent" name="consent" type="checkbox" value="true">
      <span>The visitor agrees that LoveWorld may use this photo to create a personalised video with AI, store it with
        their name and phone number, and show the finished video to them through a private link.</span>
    </label>

    <div id="error" class="error" role="alert"></div>
    <button id="submit" class="primary" type="submit">Create video</button>
  </form>

  <section id="done" class="hidden">
    <div class="ticket-box">
      <div class="muted">Ticket</div>
      <div class="ticket" id="ticket"></div>
      <div id="visitor" class="muted"></div>
      <p><strong id="status">Queued</strong></p>
      <p class="muted" id="status-detail"></p>
    </div>
    <button class="primary" id="next">Next visitor</button>
  </section>
</main>

<script>window.TEMPLATES = {{templates_json}};</script>
<script src="/static/capture.js"></script>
</body>
</html>
